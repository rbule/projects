spring:
  datasource:
    url: jdbc:mariadb://order-db:3306/orders
    username: root
    password: vrlosigurnasifra
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MariaDBDialect

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  metrics:
    tags:
      application: order-service
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

spring.rabbitmq.host: products-queue
spring.rabbitmq.port: 5672
spring.rabbitmq.username: products
spring.rabbitmq.password: vrlosigurnasifra
